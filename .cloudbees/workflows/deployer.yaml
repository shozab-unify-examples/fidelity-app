apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true

jobs:
  hackers-api:
    if: ${{ fromJSON(inputs.manifest)['fidelity-api']['hackers-api'].deploy }}
    steps:
      - name: Simulate hackers-api deployment
        uses: docker://alpine:3.20
        run: |
          echo "========================================"
          echo "HACKERS API DEPLOYMENT"
          echo "========================================"
          echo "Component: hackers-api"
          echo "Environment: ${{ inputs.environment }}"
          echo "Artifact ID: ${{ fromJSON(inputs.manifest)['fidelity-api']['hackers-api'].id }}"
          echo "Artifact URL: ${{ fromJSON(inputs.manifest)['fidelity-api']['hackers-api'].url }}"
          echo
          echo "Starting simulated deployment..."
          sleep 5
          echo "Deployment simulation completed successfully."

      - name: Register hackers-api deployment
        kind: deploy
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ fromJSON(inputs.manifest)['fidelity-api']['hackers-api'].id }}
          target-environment: ${{ inputs.environment }}
          labels: demo,hackers-api

      - name: Publish hackers-api deployment evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            # Deployment Registration Completed

            **Component:** `hackers-api`

            - **Environment:** `${{ inputs.environment }}`
            - **Artifact ID:** `${{ fromJSON(inputs.manifest)['fidelity-api']['hackers-api'].id }}`
            - **Artifact URL:** `${{ fromJSON(inputs.manifest)['fidelity-api']['hackers-api'].url }}`
            - **Deployment status:** `SUCCESS`
            - **Environment registration:** `COMPLETED`
            - **Deployment mode:** `SIMULATED`

            The artifact was registered as deployed to the target CloudBees Unify environment.

            This demonstration records deployment activity and environment inventory without claiming that a live Kubernetes workload was started.
          format: MARKDOWN

